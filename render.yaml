services:
  - type: web
    name: giftora-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_INIT_DATA_MAX_AGE
        value: "86400"
      - key: CORS_ORIGINS
        value: https://giftora-1w15.onrender.com,http://localhost:5173

  - type: web
    name: giftora
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://giftora-api-l0k8.onrender.com
